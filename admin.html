<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Add Questions</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #2c3e50; color: white;}
        .container { background: #34495e; padding: 30px; border-radius: 10px; max-width: 600px; margin: auto; }
        h2 { border-bottom: 2px solid #e74c3c; padding-bottom: 10px; text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #bdc3c7;}
        input[type="text"], input[type="number"], select, textarea { width: 100%; padding: 10px; border: none; border-radius: 5px; box-sizing: border-box; }
        button { background: #e74c3c; color: white; padding: 12px 20px; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-weight: bold; margin-top: 10px;}
        button:hover { background: #c0392b; }
        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.9em; color: #95a5a6; font-weight: bold;}
    </style>
</head>
<body>
    <div class="container">
        <h2>⚙️ Admin Panel - Test Portal</h2>
        <form id="add-q-form">
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;">
                    <label>Exam Name (e.g. JEE):</label>
                    <input type="text" id="exam-name" required>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Test Name (e.g. Mock 1):</label>
                    <input type="text" id="test-name" required>
                </div>
            </div>
            <div class="form-group">
                <label>Question Text:</label>
                <textarea id="q-text" rows="3" required></textarea>
            </div>
            <div class="form-group"><label>Option 1:</label><input type="text" id="opt-0" required></div>
            <div class="form-group"><label>Option 2:</label><input type="text" id="opt-1" required></div>
            <div class="form-group"><label>Option 3:</label><input type="text" id="opt-2" required></div>
            <div class="form-group"><label>Option 4:</label><input type="text" id="opt-3" required></div>
            <div class="form-group">
                <label>Sahi Jawab:</label>
                <select id="correct-opt">
                    <option value="0">Option 1</option>
                    <option value="1">Option 2</option>
                    <option value="2">Option 3</option>
                    <option value="3">Option 4</option>
                </select>
            </div>
            <div style="display: flex; gap: 10px;">
                <div class="form-group" style="flex: 1;"><label>Marks (+):</label><input type="number" id="pos-marks" value="4" required></div>
                <div class="form-group" style="flex: 1;"><label>Minus (-):</label><input type="number" id="neg-marks" value="1" required></div>
            </div>
            <button type="submit">Add Question</button>
            <div id="status"></div>
        </form>
        <div class="footer">Developed by Tomar Ji</div>
    </div>

    <script>
        document.getElementById('add-q-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const payload = {
                examName: document.getElementById('exam-name').value.trim(),
                testName: document.getElementById('test-name').value.trim(),
                text: document.getElementById('q-text').value,
                options: [
                    document.getElementById('opt-0').value,
                    document.getElementById('opt-1').value,
                    document.getElementById('opt-2').value,
                    document.getElementById('opt-3').value
                ],
                correctOptionIndex: parseInt(document.getElementById('correct-opt').value),
                positiveMarks: parseInt(document.getElementById('pos-marks').value),
                negativeMarks: parseInt(document.getElementById('neg-marks').value)
            };

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "Loading..."; statusDiv.style.color = "yellow";

            try {
                const response = await fetch('/add-question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if(response.ok) {
                    statusDiv.innerHTML = "✅ " + data.message; statusDiv.style.color = "#2ecc71";
                    // Taki bar bar exam aur test ka naam na dalna pade, unko clear nahi karenge
                    document.getElementById('q-text').value = '';
                    document.getElementById('opt-0').value = '';
                    document.getElementById('opt-1').value = '';
                    document.getElementById('opt-2').value = '';
                    document.getElementById('opt-3').value = '';
                } else {
                    statusDiv.innerHTML = "❌ " + data.error; statusDiv.style.color = "#e74c3c";
                }
            } catch (err) { statusDiv.innerHTML = "❌ Server error!"; statusDiv.style.color = "#e74c3c"; }
        });
    </script>
</body>
</html>
