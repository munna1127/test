<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Tomar Ji</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f4f6f9; color: #333;}
        .container { background: white; padding: 30px; border-radius: 10px; max-width: 900px; margin: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.1);}
        h2 { border-bottom: 2px solid #e74c3c; padding-bottom: 10px; text-align: center; margin-top:0; color: #2c3e50;}
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #34495e;}
        input[type="text"], input[type="password"], input[type="number"], select, textarea { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px;}
        button { background: #e74c3c; color: white; padding: 10px 15px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.3s;}
        button:hover { background: #c0392b; }
        .tab-btn { background: #34495e; margin-right: 5px; margin-bottom: 15px;}
        .tab-btn.active { background: #e74c3c; }
        
        .filter-box { background: #e9ecef; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 15px; align-items: center; flex-wrap: wrap;}
        
        /* Table Styles */
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
        th { background-color: #34495e; color: white; }
        tr:nth-child(even) { background-color: #f9f9f9; }
        .action-btn { padding: 5px 10px; margin: 2px; font-size: 12px; }
        .edit-btn { background: #f39c12; }
        .edit-btn:hover { background: #d68910; }
        .del-btn { background: #e74c3c; }
        .del-btn:hover { background: #c0392b; }

        /* Card View Styles (Naya Interface) */
        .view-toggle-btn { background: #9b59b6; margin-bottom: 10px; font-size: 13px; }
        .view-toggle-btn:hover { background: #8e44ad; }
        .card-view { display: none; } /* Default hidden */
        .q-card { background: #fff; border: 1px solid #ddd; border-left: 4px solid #3498db; border-radius: 5px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .q-card h4 { margin-top: 0; margin-bottom: 10px; color: #2c3e50; font-size: 16px;}
        .q-card-options { list-style-type: none; padding-left: 0; margin-bottom: 15px; }
        .q-card-options li { padding: 8px; border: 1px solid #eee; margin-bottom: 5px; border-radius: 4px; font-size: 14px; background: #fafafa;}
        .q-card-options li.correct { background-color: #d4edda; border-color: #c3e6cb; font-weight: bold; color: #155724;}
        .q-card-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #eee; padding-top: 10px; font-size: 12px; color: #7f8c8d; flex-wrap: wrap; gap: 10px;}

        #status { margin-top: 15px; text-align: center; font-weight: bold; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.9em; color: #7f8c8d; font-weight: bold;}
    </style>
</head>
<body>

    <div id="admin-login-section" class="container" style="max-width: 500px;">
        <h2>🔒 Admin Login</h2>
        <div class="form-group"><label>Admin ID:</label><input type="text" id="admin-user" placeholder="Username daalo"></div>
        <div class="form-group"><label>Password:</label><input type="password" id="admin-pass" placeholder="Password daalo"></div>
        <button onclick="handleAdminLogin()" style="width:100%">Login as Admin</button>
        <div id="login-status" style="text-align:center; margin-top:10px; font-weight:bold;"></div>
    </div>

    <div id="admin-panel-section" class="container" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2 style="margin: 0; border: none;">⚙️ Dashboard</h2>
            <button onclick="adminLogout()" style="background:#7f8c8d;">Logout</button>
        </div>
        
        <div style="margin-top: 20px; text-align: center;">
            <button class="tab-btn active" id="tab-add-btn" onclick="switchTab('add')">➕ Add / Edit Question</button>
            <button class="tab-btn" id="tab-manage-btn" onclick="switchTab('manage')">📋 Manage All Questions</button>
        </div>

        <div id="add-tab">
            <h3 id="form-title" style="color: #2980b9;">Naya Question Jodo</h3>
            <form id="add-q-form">
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 45%;">
                        <label>Exam Name:</label>
                        <select id="exam-select" onchange="handleExamChange()" required>
                            <option value="">-- Select Exam --</option>
                        </select>
                        <input type="text" id="custom-exam" placeholder="Naye Exam ka naam likho..." style="display:none; margin-top:8px; border: 2px solid #e74c3c;">
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 45%;">
                        <label>Test Name:</label>
                        <select id="test-select" onchange="toggleCustomInput('test')" required>
                            <option value="">-- Pehle Exam Chuno --</option>
                        </select>
                        <input type="text" id="custom-test" placeholder="Naye Test ka naam likho..." style="display:none; margin-top:8px; border: 2px solid #e74c3c;">
                    </div>
                </div>

                <div class="form-group"><label>Question Text:</label><textarea id="q-text" rows="3" required></textarea></div>
                <div class="form-group"><label>Option 1:</label><input type="text" id="opt-0" required></div>
                <div class="form-group"><label>Option 2:</label><input type="text" id="opt-1" required></div>
                <div class="form-group"><label>Option 3:</label><input type="text" id="opt-2" required></div>
                <div class="form-group"><label>Option 4:</label><input type="text" id="opt-3" required></div>
                <div class="form-group">
                    <label>Sahi Jawab:</label>
                    <select id="correct-opt">
                        <option value="0">Option 1</option><option value="1">Option 2</option>
                        <option value="2">Option 3</option><option value="3">Option 4</option>
                    </select>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="form-group" style="flex: 1;"><label>Marks (+):</label><input type="number" id="pos-marks" value="4" required></div>
                    <div class="form-group" style="flex: 1;"><label>Minus (-):</label><input type="number" id="neg-marks" value="1" required></div>
                </div>
                <button type="submit" id="submit-btn" style="width:100%">Save Question</button>
                <button type="button" id="cancel-edit-btn" onclick="cancelEdit()" style="width:100%; background:#95a5a6; margin-top:10px; display:none;">Cancel Edit</button>
                <div id="status"></div>
            </form>
        </div>

        <div id="manage-tab" style="display: none;">
            <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap;">
                <h3 style="color: #2980b9; margin-bottom: 10px;">📋 Questions Manage Karo</h3>
                <button class="view-toggle-btn" id="view-toggle-btn" onclick="toggleViewMode()" style="width: auto;">👁️ Detailed View dekhein</button>
            </div>
            
            <div class="filter-box">
                <div style="flex: 1; min-width: 150px;">
                    <label style="color: #2c3e50;">Filter by Exam:</label>
                    <select id="filter-exam" onchange="handleFilterExamChange()">
                        <option value="">-- Sabhi Exams Dekho --</option>
                    </select>
                </div>
                <div style="flex: 1; min-width: 150px;">
                    <label style="color: #2c3e50;">Filter by Test:</label>
                    <select id="filter-test" onchange="renderFilteredTable()">
                        <option value="">-- Sabhi Tests Dekho --</option>
                    </select>
                </div>
            </div>

            <!-- Interface 1: Table View -->
            <div id="table-view-container" style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Exam</th>
                            <th>Test</th>
                            <th>Question</th>
                            <th style="min-width: 120px;">Action</th>
                        </tr>
                    </thead>
                    <tbody id="questions-table-body">
                        <tr><td colspan="4" style="text-align:center;">Loading...</td></tr>
                    </tbody>
                </table>
            </div>

            <!-- Interface 2: Detailed Card View -->
            <div id="card-view-container" class="card-view">
                <!-- Cards yahan aayenge -->
            </div>
        </div>

        <div class="footer">Developed by Tomar Ji</div>
    </div>

    <script>
        let allQuestions = [];
        let editingId = null;
        let currentViewMode = 'table'; // Default view

        function checkAdminLogin() {
            if(localStorage.getItem('isAdminLoggedIn') === 'true') {
                document.getElementById('admin-login-section').style.display = 'none';
                document.getElementById('admin-panel-section').style.display = 'block';
                fetchAllData(); 
            } else {
                document.getElementById('admin-login-section').style.display = 'block';
                document.getElementById('admin-panel-section').style.display = 'none';
            }
        }
        window.onload = checkAdminLogin;

        async function handleAdminLogin() {
            const user = document.getElementById('admin-user').value;
            const pass = document.getElementById('admin-pass').value;
            const status = document.getElementById('login-status');

            if(!user || !pass) return status.innerText = "❌ Details daalo!", status.style.color = "red";
            status.innerText = "Loading..."; status.style.color = "orange";
            try {
                const res = await fetch('/admin-login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username: user, password: pass }) });
                if(res.ok) { localStorage.setItem('isAdminLoggedIn', 'true'); checkAdminLogin(); } 
                else { status.innerText = "❌ Galat ID/Password!"; status.style.color = "red"; }
            } catch (err) { status.innerText = "❌ Server error!"; }
        }

        function adminLogout() { localStorage.removeItem('isAdminLoggedIn'); checkAdminLogin(); }

        function switchTab(tab) {
            document.getElementById('add-tab').style.display = tab === 'add' ? 'block' : 'none';
            document.getElementById('manage-tab').style.display = tab === 'manage' ? 'block' : 'none';
            document.getElementById('tab-add-btn').className = tab === 'add' ? 'tab-btn active' : 'tab-btn';
            document.getElementById('tab-manage-btn').className = tab === 'manage' ? 'tab-btn active' : 'tab-btn';
            if(tab === 'manage') fetchAllData();
        }

        // Naya Function: Interface change karne ke liye
        function toggleViewMode() {
            currentViewMode = currentViewMode === 'table' ? 'card' : 'table';
            const btn = document.getElementById('view-toggle-btn');
            
            if (currentViewMode === 'table') {
                btn.innerHTML = '👁️ Detailed View dekhein';
                btn.style.background = '#9b59b6';
                document.getElementById('table-view-container').style.display = 'block';
                document.getElementById('card-view-container').style.display = 'none';
            } else {
                btn.innerHTML = '🗜️ Table View dekhein';
                btn.style.background = '#34495e';
                document.getElementById('table-view-container').style.display = 'none';
                document.getElementById('card-view-container').style.display = 'block';
            }
            renderFilteredTable(); // Re-render content based on active mode
        }

        function toggleCustomInput(type) {
            const selectVal = document.getElementById(type + '-select').value;
            const customInput = document.getElementById('custom-' + type);
            if(selectVal === 'NEW_ITEM') {
                customInput.style.display = 'block';
                customInput.setAttribute('required', 'true');
            } else {
                customInput.style.display = 'none';
                customInput.removeAttribute('required');
                customInput.value = '';
            }
        }

        function handleExamChange() {
            const examVal = document.getElementById('exam-select').value;
            toggleCustomInput('exam');

            let tests = [];
            if(examVal && examVal !== 'NEW_ITEM') {
                tests = [...new Set(allQuestions.filter(q => q.examName === examVal).map(q => q.testName).filter(Boolean))];
            }

            document.getElementById('test-select').innerHTML = 
                `<option value="">-- Select Test --</option>` + 
                tests.map(t => `<option value="${t}">${t}</option>`).join('') +
                `<option value="NEW_ITEM" style="font-weight:bold; color:#e74c3c;">➕ Naya Test Jodo</option>`;

            if (examVal === 'NEW_ITEM') {
                document.getElementById('test-select').value = 'NEW_ITEM';
                toggleCustomInput('test');
            } else {
                document.getElementById('custom-test').style.display = 'none';
                document.getElementById('custom-test').removeAttribute('required');
            }
        }

        async function fetchAllData() {
            try {
                const res = await fetch('/all-questions');
                allQuestions = await res.json();
                
                const exams = [...new Set(allQuestions.map(q => q.examName).filter(Boolean))];
                
                document.getElementById('exam-select').innerHTML = 
                    `<option value="">-- Select Exam --</option>` + 
                    exams.map(e => `<option value="${e}">${e}</option>`).join('') +
                    `<option value="NEW_ITEM" style="font-weight:bold; color:#e74c3c;">➕ Naya Exam Jodo</option>`;
                document.getElementById('test-select').innerHTML = `<option value="">-- Pehle Exam Chuno --</option><option value="NEW_ITEM" style="font-weight:bold; color:#e74c3c;">➕ Naya Test Jodo</option>`;

                document.getElementById('filter-exam').innerHTML = 
                    `<option value="">-- Sabhi Exams Dekho --</option>` + 
                    exams.map(e => `<option value="${e}">${e}</option>`).join('');
                
                handleFilterExamChange(); 

            } catch(e) { console.log(e); }
        }

        function handleFilterExamChange() {
            const examVal = document.getElementById('filter-exam').value;
            let tests = [];
            
            if(examVal) {
                tests = [...new Set(allQuestions.filter(q => q.examName === examVal).map(q => q.testName).filter(Boolean))];
            } else {
                tests = [...new Set(allQuestions.map(q => q.testName).filter(Boolean))];
            }

            document.getElementById('filter-test').innerHTML = 
                `<option value="">-- Sabhi Tests Dekho --</option>` + 
                tests.map(t => `<option value="${t}">${t}</option>`).join('');
                
            renderFilteredTable();
        }

        function renderFilteredTable() {
            const examVal = document.getElementById('filter-exam').value;
            const testVal = document.getElementById('filter-test').value;

            let filtered = allQuestions;
            if(examVal) filtered = filtered.filter(q => q.examName === examVal);
            if(testVal) filtered = filtered.filter(q => q.testName === testVal);

            const tbody = document.getElementById('questions-table-body');
            const cardContainer = document.getElementById('card-view-container');

            if(filtered.length === 0) {
                const emptyMsg = '<tr><td colspan="4" style="text-align:center; color:red;">Is filter mein koi question nahi mila.</td></tr>';
                tbody.innerHTML = emptyMsg;
                cardContainer.innerHTML = '<p style="text-align:center; color:red; font-weight:bold;">Is filter mein koi question nahi mila.</p>';
                return;
            }
            
            // 1. Table View Data
            tbody.innerHTML = filtered.map(q => `
                <tr>
                    <td><strong>${q.examName || '-'}</strong></td>
                    <td>${q.testName || '-'}</td>
                    <td>${(q.text || '').substring(0, 45)}...</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="startEdit('${q._id}')">Edit</button>
                        <button class="action-btn del-btn" onclick="deleteQuestion('${q._id}')">Delete</button>
                    </td>
                </tr>
            `).join('');

            // 2. Card (Detailed) View Data
            cardContainer.innerHTML = filtered.map((q, qIndex) => {
                let optionsHtml = '';
                q.options.forEach((opt, optIndex) => {
                    let isCorrectClass = optIndex === q.correctOptionIndex ? 'class="correct"' : '';
                    let checkMark = optIndex === q.correctOptionIndex ? '✅' : '';
                    optionsHtml += `<li ${isCorrectClass}>${optIndex + 1}. ${opt} ${checkMark}</li>`;
                });

                return `
                <div class="q-card">
                    <h4>Q: ${q.text}</h4>
                    <ul class="q-card-options">${optionsHtml}</ul>
                    <div class="q-card-footer">
                        <div>
                            <strong>Exam:</strong> ${q.examName || '-'} <br>
                            <strong>Test:</strong> ${q.testName || '-'} <br>
                            <strong>Marks:</strong> <span style="color:green;">+${q.positiveMarks}</span> / <span style="color:red;">-${q.negativeMarks}</span>
                        </div>
                        <div style="margin-top: 10px;">
                            <button class="action-btn edit-btn" onclick="startEdit('${q._id}')" style="padding: 8px 12px; font-size: 14px;">Edit</button>
                            <button class="action-btn del-btn" onclick="deleteQuestion('${q._id}')" style="padding: 8px 12px; font-size: 14px;">Delete</button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }

        async function deleteQuestion(id) {
            if(confirm("Pakka is question ko delete karna hai?")) {
                await fetch(`/delete-question/${id}`, { method: 'DELETE' });
                fetchAllData(); 
            }
        }

        function startEdit(id) {
            const q = allQuestions.find(x => x._id === id);
            if(!q) return;
            
            editingId = id;
            document.getElementById('form-title').innerText = "✏️ Question Edit Karo";
            document.getElementById('submit-btn').innerText = "Update Data";
            document.getElementById('submit-btn').style.background = "#f39c12";
            document.getElementById('cancel-edit-btn').style.display = "block";
            
            document.getElementById('exam-select').value = q.examName || '';
            handleExamChange(); 
            
            document.getElementById('test-select').value = q.testName || '';
            toggleCustomInput('test');

            document.getElementById('q-text').value = q.text || '';
            document.getElementById('opt-0').value = q.options[0] || '';
            document.getElementById('opt-1').value = q.options[1] || '';
            document.getElementById('opt-2').value = q.options[2] || '';
            document.getElementById('opt-3').value = q.options[3] || '';
            document.getElementById('correct-opt').value = q.correctOptionIndex;
            document.getElementById('pos-marks').value = q.positiveMarks;
            document.getElementById('neg-marks').value = q.negativeMarks;

            switchTab('add');
            window.scrollTo(0, 0);
        }

        function cancelEdit() {
            editingId = null;
            document.getElementById('form-title').innerText = "Naya Question Jodo";
            document.getElementById('submit-btn').innerText = "Save Question";
            document.getElementById('submit-btn').style.background = "#e74c3c";
            document.getElementById('cancel-edit-btn').style.display = "none";
            document.getElementById('q-text').value = '';
        }

        document.getElementById('add-q-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            let finalExam = document.getElementById('exam-select').value;
            if(finalExam === 'NEW_ITEM') finalExam = document.getElementById('custom-exam').value.trim();
            
            let finalTest = document.getElementById('test-select').value;
            if(finalTest === 'NEW_ITEM') finalTest = document.getElementById('custom-test').value.trim();

            const payload = {
                examName: finalExam,
                testName: finalTest,
                text: document.getElementById('q-text').value,
                options: [
                    document.getElementById('opt-0').value,
                    document.getElementById('opt-1').value,
                    document.getElementById('opt-2').value,
                    document.getElementById('opt-3').value
                ],
                correctOptionIndex: parseInt(document.getElementById('correct-opt').value),
                positiveMarks: parseInt(document.getElementById('pos-marks').value),
                negativeMarks: parseInt(document.getElementById('neg-marks').value)
            };

            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = "Saving..."; statusDiv.style.color = "orange";

            const endpoint = editingId ? `/update-question/${editingId}` : '/add-question';
            const method = editingId ? 'PUT' : 'POST';

            try {
                const res = await fetch(endpoint, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();
                if(res.ok) {
                    statusDiv.innerHTML = "✅ " + data.message; statusDiv.style.color = "green";
                    setTimeout(() => { statusDiv.innerHTML = ""; }, 2000);
                    
                    if(editingId) cancelEdit(); 
                    else {
                        document.getElementById('q-text').value = '';
                        document.getElementById('opt-0').value = '';
                        document.getElementById('opt-1').value = '';
                        document.getElementById('opt-2').value = '';
                        document.getElementById('opt-3').value = '';
                    }
                    fetchAllData(); 
                } else { statusDiv.innerHTML = "❌ Error!"; statusDiv.style.color = "red"; }
            } catch (err) { statusDiv.innerHTML = "❌ Server error!"; }
        });
    </script>
</body>
</html>
