<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        const savedTheme = localStorage.getItem('portalTheme') || 'default';
        document.documentElement.setAttribute('data-theme', savedTheme);
        function changeTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('portalTheme', theme);
        }
        window.addEventListener('DOMContentLoaded', () => {
            const select = document.getElementById('theme-switcher');
            if(select) select.value = savedTheme;
        });
    </script>
    <style>
        :root {
            --bg-main: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-card: rgba(255, 255, 255, 0.95);
            --text-main: #2d3748;
            --text-heading: #1a202c;
            --primary-color: #4299e1;
            --primary-btn: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --danger-btn: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%);
            --success-btn: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            --input-bg: #f8fafc;
            --input-border: #e2e8f0;
            --shadow: 0 20px 40px rgba(0,0,0,0.08);
            --table-head-bg: #2d3748;
            --table-head-text: #ffffff;
            --table-border: #edf2f7;
            --table-hover: #f7fafc;
            --correct-bg: #d4edda;
            --correct-text: #155724;
        }

        [data-theme="dark"] {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --text-main: #cbd5e1;
            --text-heading: #f8fafc;
            --primary-color: #3b82f6;
            --primary-btn: linear-gradient(135deg, #3b82f6 0%, #2dd4bf 100%);
            --danger-btn: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            --success-btn: linear-gradient(135deg, #10b981 0%, #059669 100%);
            --input-bg: #0f172a;
            --input-border: #334155;
            --shadow: 0 20px 40px rgba(0,0,0,0.4);
            --table-head-bg: #0f172a;
            --table-head-text: #f8fafc;
            --table-border: #334155;
            --table-hover: #334155;
            --correct-bg: #064e3b;
            --correct-text: #a7f3d0;
        }

        [data-theme="glass"] {
            --bg-main: linear-gradient(45deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            --bg-card: rgba(255, 255, 255, 0.4);
            --text-main: #1f2937;
            --text-heading: #111827;
            --primary-color: #e11d48;
            --primary-btn: linear-gradient(135deg, #f6d365 0%, #fda085 100%);
            --danger-btn: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
            --success-btn: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --input-bg: rgba(255, 255, 255, 0.6);
            --input-border: rgba(255, 255, 255, 0.4);
            --shadow: 0 8px 32px rgba(31, 38, 135, 0.15);
            --table-head-bg: rgba(255,255,255,0.6);
            --table-head-text: #111827;
            --table-border: rgba(255,255,255,0.4);
            --table-hover: rgba(255,255,255,0.5);
            --correct-bg: rgba(212, 237, 218, 0.8);
            --correct-text: #155724;
        }

        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background: var(--bg-main); min-height: 100vh; color: var(--text-main); transition: background 0.3s ease;}
        
        .theme-selector { position: absolute; top: 20px; right: 20px; z-index: 1000; }
        .theme-selector select { padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; background: var(--bg-card); color: var(--text-heading); border: 1px solid var(--input-border); cursor: pointer; backdrop-filter: blur(10px); outline: none;}
        
        .container { background: var(--bg-card); padding: 40px; border-radius: 20px; box-shadow: var(--shadow); max-width: 650px; margin: 60px auto 20px auto; border: 1px solid var(--input-border); backdrop-filter: blur(15px); transition: all 0.3s ease;}
        h2, h3, h4 { color: var(--text-heading); }
        h2 { border-bottom: none; padding-bottom: 0; text-align: center; font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 25px;}
        input[type="text"], input[type="email"], input[type="password"], input[type="number"] { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--input-border); font-size: 15px; box-sizing: border-box; background: var(--input-bg); color: var(--text-main); transition: all 0.3s;}
        input:focus { border-color: var(--primary-color); outline: none; }
        .selection-box { background: var(--input-bg); padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid var(--input-border); }
        select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid var(--input-border); font-size: 15px; background: var(--input-bg); color: var(--text-main); cursor: pointer; transition: all 0.3s;}
        select:focus { border-color: var(--primary-color); outline: none;}
        button { background: var(--primary-btn); color: white; padding: 14px; border: none; cursor: pointer; font-weight: 600; border-radius: 12px; font-size: 16px; width: 100%; margin-top: 15px; transition: all 0.3s ease; letter-spacing: 0.5px;}
        button:hover { transform: translateY(-2px); filter: brightness(1.1); }
        
        .question { margin-bottom: 25px; padding: 20px; background: var(--bg-card); border-left: 5px solid var(--primary-color); border-radius: 12px; border-top: 1px solid var(--input-border); border-right: 1px solid var(--input-border); border-bottom: 1px solid var(--input-border);}
        .marks { color: var(--text-main); font-size: 0.85em; float: right; font-weight: 600; background: var(--input-bg); padding: 4px 8px; border-radius: 6px;}
        .options { list-style: none; padding: 0; margin-top: 15px;}
        .options li { margin: 10px 0; }
        .options label { cursor: pointer; display: block; padding: 12px 15px; border: 2px solid var(--input-border); border-radius: 10px; transition: all 0.2s; font-size: 15px; color: var(--text-main); background: var(--bg-card);}
        .options label:hover { border-color: var(--primary-color); }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); accent-color: var(--primary-color);}
        
        .submit-btn { background: var(--success-btn); margin-top: 25px;}
        .timer-badge { position: sticky; top: 15px; z-index: 1000; background: var(--success-btn); color: white; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow); float: right; margin-bottom: 15px; transition: all 0.3s; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { filter: brightness(1.5); } 100% { transform: scale(1); } }
        
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; font-size: 14px; border-radius: 12px; overflow: hidden; border: 1px solid var(--table-border);}
        th, td { padding: 15px; text-align: left; }
        th { background-color: var(--table-head-bg); color: var(--table-head-text); font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;}
        td { border-bottom: 1px solid var(--table-border); background: var(--bg-card); color: var(--text-main);}
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: var(--table-hover); }
        .footer { text-align: center; margin-top: 40px; font-size: 0.85em; color: var(--text-main); font-weight: 600; opacity: 0.7;}
    </style>
</head>
<body>
    
    <div class="theme-selector">
        <select id="theme-switcher" onchange="changeTheme(this.value)">
            <option value="default">🎨 Clean Premium</option>
            <option value="dark">🌙 Dark Hacker</option>
            <option value="glass">🔮 Glassmorphism</option>
        </select>
    </div>

    <div id="auth-section" class="container">
        <h2 id="auth-title">🎓 Student Login</h2>
        <input type="text" id="auth-name" placeholder="Full Name" style="display:none;">
        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-password" placeholder="Password">
        <button onclick="handleAuth()" id="auth-btn">Login to Portal</button>
        <p style="text-align:center; cursor:pointer; color:var(--primary-color); margin-top: 20px; font-weight: 500;" onclick="toggleAuth()">New user? <strong>Create an Account</strong></p>
        <div id="auth-status" style="text-align:center; margin-top:15px; font-weight:600;"></div>
    </div>

    <div id="portal-section" class="container" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
            <h2 style="margin: 0;">📝 Test Portal</h2>
            <button onclick="logout()" style="width:auto; background: var(--danger-btn); padding:8px 20px; margin:0; font-size: 14px; border-radius: 8px;">Logout</button>
        </div>
        <h4 style="margin-bottom: 25px; font-size: 18px;">Welcome back, <span id="user-display-name" style="font-weight:700; color: var(--primary-color);"></span>!</h4>
        
        <div id="selection-area" class="selection-box">
            <label><strong>Select Exam:</strong></label>
            <select id="exam-select" onchange="fetchTests()">
                <option value="">-- Select Exam --</option>
            </select>

            <label style="display:block; margin-top:20px;"><strong>Select Test:</strong></label>
            <select id="test-select">
                <option value="">-- Select Exam First --</option>
            </select>

            <!-- CUSTOM TIMER INPUT ADDED HERE -->
            <label style="display:block; margin-top:20px;"><strong>⏱️ Custom Timer (Minutes):</strong></label>
            <input type="number" id="custom-timer" placeholder="Leave empty for Default (2 mins per question)" min="1">

            <button onclick="startTest()" style="margin-top: 25px;">🚀 Start Test</button>
        </div>

        <div id="test-area" style="display: none;">
            <div id="timer-badge" class="timer-badge" style="display: none;">
                ⏱️ <span id="time-left">00:00</span>
            </div>
            
            <div style="clear: both;"></div> 
            <h3 id="test-title" style="text-align: center; margin-bottom: 25px; font-size: 22px;"></h3>
            
            <div id="test-container"></div>
            <button class="submit-btn" onclick="submitTest()" id="submit-btn">Submit Test</button>
            <div id="result"></div>
        </div>

        <div class="footer">Developed by Tomar Ji</div>
    </div>

    <script>
        let questionsData = [];
        let isLogin = true;
        let timerInterval;

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "🎓 Student Registration" : "🎓 Student Login";
            document.getElementById('auth-btn').innerText = isLogin ? "Register Account" : "Login to Portal";
            document.getElementById('auth-name').style.display = isLogin ? "none" : "block";
            document.getElementById('auth-status').innerText = "";
        }

        async function handleAuth() {
            const name = document.getElementById('auth-name').value;
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            if(!email || !password || (!isLogin && !name)) {
                status.innerText = "❌ Please fill all fields!";
                status.style.color = "var(--danger-btn)"; return;
            }

            status.innerText = "Processing..."; status.style.color = "var(--primary-color)";
            const endpoint = isLogin ? '/login' : '/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const data = await res.json();

                if(res.ok) {
                    if(isLogin) {
                        localStorage.setItem('userName', data.name);
                        localStorage.setItem('userEmail', data.email);
                        checkLogin();
                    } else {
                        status.innerText = "✅ " + data.message; status.style.color = "var(--success-btn)";
                        setTimeout(toggleAuth, 1500);
                    }
                } else { status.innerText = "❌ " + data.error; status.style.color = "var(--danger-btn)"; }
            } catch (e) { status.innerText = "❌ Server error!"; status.style.color = "var(--danger-btn)"; }
        }

        function checkLogin() {
            const userName = localStorage.getItem('userName');
            if(userName) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('portal-section').style.display = 'block';
                document.getElementById('user-display-name').innerText = userName;
                loadExams();
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('portal-section').style.display = 'none';
            }
        }

        function logout() { localStorage.removeItem('userName'); localStorage.removeItem('userEmail'); location.reload(); }
        window.onload = checkLogin;

        function loadExams() {
            fetch('/get-exams').then(res => res.json()).then(exams => {
                const examSelect = document.getElementById('exam-select');
                examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                exams.forEach(exam => { if(exam) examSelect.innerHTML += `<option value="${exam}">${exam}</option>`; });
            });
        }

        function fetchTests() {
            const examName = document.getElementById('exam-select').value;
            const testSelect = document.getElementById('test-select');
            testSelect.innerHTML = '<option value="">-- Loading... --</option>';
            if(!examName) { testSelect.innerHTML = '<option value="">-- Select Exam First --</option>'; return; }
            fetch(`/get-tests/${examName}`).then(res => res.json()).then(tests => {
                testSelect.innerHTML = '<option value="">-- Select Test --</option>';
                tests.forEach(test => { if(test) testSelect.innerHTML += `<option value="${test}">${test}</option>`; });
            });
        }

        function startTimer(durationInSeconds) {
            let timer = durationInSeconds, minutes, seconds;
            const display = document.getElementById('time-left');
            const badge = document.getElementById('timer-badge');
            
            badge.style.display = 'inline-flex';
            badge.style.background = 'var(--success-btn)';
            badge.style.animation = 'none';

            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);
                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;
                display.textContent = minutes + ":" + seconds;

                if (timer <= 60) {
                    badge.style.background = 'var(--danger-btn)';
                    badge.style.animation = 'pulse 1s infinite';
                }
                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Time is up! Auto-submitting your test.");
                    submitTest(true); 
                }
            }, 1000);
        }

        function startTest() {
            const examName = document.getElementById('exam-select').value;
            const testName = document.getElementById('test-select').value;
            const customTimer = document.getElementById('custom-timer').value;
            
            if(!examName || !testName) return alert("Please select both Exam and Test!");

            document.getElementById('selection-area').style.display = 'none';
            document.getElementById('test-area').style.display = 'block';
            document.getElementById('test-title').innerText = `${examName} - ${testName}`;
            document.getElementById('test-container').innerHTML = '<p style="text-align:center;">Loading Questions...</p>';

            fetch('/get-test-questions', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ examName, testName }) })
            .then(res => res.json()).then(data => {
                questionsData = data; renderTest();
                if(questionsData.length > 0) {
                    let totalSeconds;
                    if(customTimer && parseInt(customTimer) > 0) {
                        // Agar student ne time diya hai, toh usko use karo
                        totalSeconds = parseInt(customTimer) * 60;
                    } else {
                        // Agar khali chhod diya, toh Default Admin Rule (2 mins per question)
                        totalSeconds = questionsData.length * 120;
                    }
                    startTimer(totalSeconds);
                }
            });
        }

        function renderTest() {
            const container = document.getElementById('test-container');
            container.innerHTML = '';
            if(questionsData.length === 0) {
                container.innerHTML = '<p style="text-align:center;">No questions available for this test.</p>';
                document.getElementById('submit-btn').style.display = 'none'; return;
            }

            questionsData.forEach((q, index) => {
                let html = `<div class="question"><p style="font-size: 16px; margin-top:0;"><strong>Q${index + 1}: ${q.text}</strong> <span class="marks">+${q.positiveMarks} / -${q.negativeMarks}</span></p><ul class="options">`;
                q.options.forEach((opt, optIndex) => { html += `<li><label><input type="radio" name="q${index}" value="${optIndex}"> ${opt}</label></li>`; });
                html += `</ul></div>`; container.innerHTML += html;
            });
            document.getElementById('submit-btn').style.display = 'block';
        }

        async function submitTest(isAutoSubmit = false) {
            if(!isAutoSubmit && !confirm("Are you sure you want to submit the test?")) return;
            clearInterval(timerInterval);
            document.getElementById('timer-badge').style.display = 'none';

            let score = 0, correct = 0, wrong = 0, skipped = 0;
            questionsData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    if (parseInt(selected.value) === q.correctOptionIndex) { score += q.positiveMarks; correct++; } 
                    else { score -= q.negativeMarks; wrong++; }
                } else { skipped++; }
            });

            const examName = document.getElementById('exam-select').value;
            const testName = document.getElementById('test-select').value;
            const userEmail = localStorage.getItem('userEmail');
            const payload = { userName: localStorage.getItem('userName'), userEmail, examName, testName, score, correct, wrong, skipped };

            const container = document.getElementById('test-container');
            container.innerHTML = '<h3 style="text-align:center; color:var(--primary-color);">Submitting Test & Generating Leaderboard...</h3>';
            document.getElementById('submit-btn').style.display = 'none';

            try {
                await fetch('/save-result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const lbRes = await fetch('/leaderboard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ examName, testName }) });
                const leaderboard = await lbRes.json();

                let userRank = leaderboard.findIndex(r => r.userEmail === userEmail && r.score === score) + 1;
                
                let resultHtml = `
                    <div style="margin-top: 25px; padding: 25px; background: var(--bg-card); border-radius: 16px; border: 1px solid var(--primary-color); text-align: center;">
                        <h2 style="color:var(--primary-color); margin-top:0;">Test Submitted Successfully!</h2>
                        <h3 style="font-size: 24px;">📊 Your Score: ${score}</h3>
                        <p style="font-weight:500;">✅ Correct: ${correct} &nbsp;|&nbsp; ❌ Incorrect: ${wrong} &nbsp;|&nbsp; ⚠️ Skipped: ${skipped}</p>
                        <h2 style="border:2px dashed var(--primary-color); display:inline-block; padding:12px 25px; border-radius:12px; background:var(--input-bg);">🏆 Your Rank: #${userRank} <span style="font-size:16px; font-weight:500;">out of ${leaderboard.length}</span></h2>
                    </div>
                    
                    <h3 style="margin-top: 40px; border-bottom: 2px solid var(--input-border); padding-bottom: 10px;">🏅 Live Leaderboard</h3>
                    <div style="overflow-x: auto;">
                    <table><thead><tr><th>Rank</th><th>Student Name</th><th>Score</th></tr></thead><tbody>
                `;

                leaderboard.forEach((entry, idx) => {
                    const isCurrentUser = (entry.userEmail === userEmail && entry.score === score);
                    const rowStyle = isCurrentUser ? 'background-color: var(--correct-bg); font-weight: bold; color: var(--correct-text);' : '';
                    const medal = idx === 0 ? '🥇 ' : (idx === 1 ? '🥈 ' : (idx === 2 ? '🥉 ' : ''));
                    resultHtml += `<tr style="${rowStyle}">
                        <td><strong style="font-size:16px;">${medal}#${idx + 1}</strong></td>
                        <td>${entry.userName} ${isCurrentUser ? '(You)' : ''}</td>
                        <td><strong style="font-size:16px;">${entry.score}</strong></td>
                    </tr>`;
                });

                resultHtml += `</tbody></table></div><button onclick="location.reload()" style="margin-top:25px; background: var(--table-head-bg);">Return to Dashboard</button>`;
                container.innerHTML = resultHtml;
            } catch (error) { container.innerHTML = '<p style="color:var(--danger-btn); text-align:center;">Error processing result. Please refresh.</p>'; }
        }
    </script>
</body>
</html>
