<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Test Portal</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; margin: 0; padding: 20px; background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); min-height: 100vh; color: #2d3748;}
        .container { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.08); max-width: 650px; margin: 20px auto; border: 1px solid rgba(255,255,255,0.4); backdrop-filter: blur(10px);}
        h2 { color: #1a202c; border-bottom: none; padding-bottom: 0; text-align: center; font-size: 28px; font-weight: 700; margin-top: 0; margin-bottom: 25px;}
        input[type="text"], input[type="email"], input[type="password"] { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 15px; box-sizing: border-box; background: #f8fafc; transition: all 0.3s;}
        input:focus { border-color: #4299e1; outline: none; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15); background: #fff;}
        .selection-box { background: #f8fafc; padding: 25px; border-radius: 16px; margin-bottom: 20px; border: 1px solid #edf2f7; }
        select { width: 100%; padding: 14px; margin-top: 10px; border-radius: 12px; border: 1px solid #e2e8f0; font-size: 15px; background: #fff; cursor: pointer; transition: all 0.3s;}
        select:focus { border-color: #4299e1; outline: none; box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.15);}
        button { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 14px; border: none; cursor: pointer; font-weight: 600; border-radius: 12px; font-size: 16px; width: 100%; margin-top: 15px; transition: all 0.3s ease; letter-spacing: 0.5px;}
        button:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.15); }
        .question { margin-bottom: 25px; padding: 20px; background: #fff; border-left: 5px solid #4299e1; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.02); border-top: 1px solid #edf2f7; border-right: 1px solid #edf2f7; border-bottom: 1px solid #edf2f7;}
        .marks { color: #718096; font-size: 0.85em; float: right; font-weight: 600; background: #edf2f7; padding: 4px 8px; border-radius: 6px;}
        .options { list-style: none; padding: 0; margin-top: 15px;}
        .options li { margin: 10px 0; }
        .options label { cursor: pointer; display: block; padding: 12px 15px; border: 2px solid #edf2f7; border-radius: 10px; transition: all 0.2s; font-size: 15px; color: #4a5568;}
        .options label:hover { background: #ebf8ff; border-color: #90cdf4; }
        input[type="radio"] { margin-right: 10px; transform: scale(1.2); accent-color: #4299e1;}
        .submit-btn { background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); margin-top: 25px;}
        .submit-btn:hover { box-shadow: 0 8px 15px rgba(56, 161, 105, 0.3); }
        
        /* Sticky Timer Styles */
        .timer-badge { position: sticky; top: 15px; z-index: 1000; background: linear-gradient(135deg, #48bb78 0%, #38a169 100%); color: white; padding: 10px 20px; border-radius: 50px; font-weight: 700; font-size: 18px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); float: right; margin-bottom: 15px; transition: all 0.3s; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); box-shadow: 0 0 15px rgba(229, 62, 62, 0.5); } 100% { transform: scale(1); } }
        
        .result-box { margin-top: 25px; padding: 25px; background: #f0fff4; border-radius: 16px; border: 1px solid #c6f6d5; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05);}
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 15px; font-size: 14px; border-radius: 12px; overflow: hidden; border: 1px solid #edf2f7;}
        th, td { padding: 15px; text-align: left; }
        th { background-color: #2d3748; color: white; font-weight: 500; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px;}
        td { border-bottom: 1px solid #edf2f7; background: #fff;}
        tr:last-child td { border-bottom: none; }
        tr:hover td { background-color: #f7fafc; }
        .footer { text-align: center; margin-top: 40px; font-size: 0.85em; color: #a0aec0; font-weight: 600; letter-spacing: 1px;}
    </style>
</head>
<body>
    
    <div id="auth-section" class="container">
        <h2 id="auth-title">🎓 Student Login</h2>
        <input type="text" id="auth-name" placeholder="Full Name" style="display:none;">
        <input type="email" id="auth-email" placeholder="Email Address">
        <input type="password" id="auth-password" placeholder="Password">
        <button onclick="handleAuth()" id="auth-btn">Login to Portal</button>
        <p style="text-align:center; cursor:pointer; color:#4299e1; margin-top: 20px; font-weight: 500;" onclick="toggleAuth()">New user? <strong>Create an Account</strong></p>
        <div id="auth-status" style="text-align:center; margin-top:15px; font-weight:600;"></div>
    </div>

    <div id="portal-section" class="container" style="display: none;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 25px;">
            <h2 style="margin: 0;">📝 Test Portal</h2>
            <button onclick="logout()" style="width:auto; background: linear-gradient(135deg, #fc8181 0%, #e53e3e 100%); padding:8px 20px; margin:0; font-size: 14px; border-radius: 8px;">Logout</button>
        </div>
        <h4 style="color:#38a169; margin-bottom: 25px; font-size: 18px;">Welcome back, <span id="user-display-name" style="color:#2d3748; font-weight:700;"></span>!</h4>
        
        <div id="selection-area" class="selection-box">
            <label><strong>Select Exam:</strong></label>
            <select id="exam-select" onchange="fetchTests()">
                <option value="">-- Select Exam --</option>
            </select>

            <label style="display:block; margin-top:20px;"><strong>Select Test:</strong></label>
            <select id="test-select">
                <option value="">-- Select Exam First --</option>
            </select>

            <button onclick="startTest()" style="margin-top: 25px;">🚀 Start Test</button>
        </div>

        <div id="test-area" style="display: none;">
            <div id="timer-badge" class="timer-badge" style="display: none;">
                ⏱️ <span id="time-left">00:00</span>
            </div>
            
            <div style="clear: both;"></div> <!-- Clear float for timer -->
            <h3 id="test-title" style="color: #4299e1; text-align: center; margin-bottom: 25px; font-size: 22px;"></h3>
            
            <div id="test-container"></div>
            <button class="submit-btn" onclick="submitTest()" id="submit-btn">Submit Test</button>
            <div id="result"></div>
        </div>

        <div class="footer">Developed by Tomar Ji</div>
    </div>

    <script>
        let questionsData = [];
        let isLogin = true;
        let timerInterval;

        function toggleAuth() {
            isLogin = !isLogin;
            document.getElementById('auth-title').innerText = isLogin ? "🎓 Student Login" : "📝 Student Registration";
            document.getElementById('auth-btn').innerText = isLogin ? "Login to Portal" : "Register Account";
            document.getElementById('auth-name').style.display = isLogin ? "none" : "block";
            document.getElementById('auth-status').innerText = "";
        }

        async function handleAuth() {
            const name = document.getElementById('auth-name').value;
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const status = document.getElementById('auth-status');

            if(!email || !password || (!isLogin && !name)) {
                status.innerText = "❌ Please fill all fields!";
                status.style.color = "#e53e3e";
                return;
            }

            status.innerText = "Processing..."; status.style.color = "#4299e1";
            const endpoint = isLogin ? '/login' : '/signup';
            const payload = isLogin ? { email, password } : { name, email, password };

            try {
                const res = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();

                if(res.ok) {
                    if(isLogin) {
                        localStorage.setItem('userName', data.name);
                        localStorage.setItem('userEmail', data.email);
                        checkLogin();
                    } else {
                        status.innerText = "✅ " + data.message; status.style.color = "#38a169";
                        setTimeout(toggleAuth, 1500);
                    }
                } else {
                    status.innerText = "❌ " + data.error; status.style.color = "#e53e3e";
                }
            } catch (e) {
                status.innerText = "❌ Server error!"; status.style.color = "#e53e3e";
            }
        }

        function checkLogin() {
            const userName = localStorage.getItem('userName');
            if(userName) {
                document.getElementById('auth-section').style.display = 'none';
                document.getElementById('portal-section').style.display = 'block';
                document.getElementById('user-display-name').innerText = userName;
                loadExams();
            } else {
                document.getElementById('auth-section').style.display = 'block';
                document.getElementById('portal-section').style.display = 'none';
            }
        }

        function logout() {
            localStorage.removeItem('userName');
            localStorage.removeItem('userEmail');
            location.reload();
        }

        window.onload = checkLogin;

        function loadExams() {
            fetch('/get-exams').then(res => res.json()).then(exams => {
                const examSelect = document.getElementById('exam-select');
                examSelect.innerHTML = '<option value="">-- Select Exam --</option>';
                exams.forEach(exam => {
                    if(exam) examSelect.innerHTML += `<option value="${exam}">${exam}</option>`;
                });
            });
        }

        function fetchTests() {
            const examName = document.getElementById('exam-select').value;
            const testSelect = document.getElementById('test-select');
            testSelect.innerHTML = '<option value="">-- Loading... --</option>';
            
            if(!examName) {
                testSelect.innerHTML = '<option value="">-- Select Exam First --</option>';
                return;
            }

            fetch(`/get-tests/${examName}`).then(res => res.json()).then(tests => {
                testSelect.innerHTML = '<option value="">-- Select Test --</option>';
                tests.forEach(test => {
                    if(test) testSelect.innerHTML += `<option value="${test}">${test}</option>`;
                });
            });
        }

        function startTimer(durationInSeconds) {
            let timer = durationInSeconds, minutes, seconds;
            const display = document.getElementById('time-left');
            const badge = document.getElementById('timer-badge');
            
            badge.style.display = 'inline-flex';
            badge.style.background = 'linear-gradient(135deg, #48bb78 0%, #38a169 100%)';
            badge.style.animation = 'none';

            timerInterval = setInterval(function () {
                minutes = parseInt(timer / 60, 10);
                seconds = parseInt(timer % 60, 10);

                minutes = minutes < 10 ? "0" + minutes : minutes;
                seconds = seconds < 10 ? "0" + seconds : seconds;

                display.textContent = minutes + ":" + seconds;

                // Aakhiri 1 minute bache toh red alert
                if (timer <= 60) {
                    badge.style.background = 'linear-gradient(135deg, #fc8181 0%, #e53e3e 100%)';
                    badge.style.animation = 'pulse 1s infinite';
                }

                if (--timer < 0) {
                    clearInterval(timerInterval);
                    alert("⏰ Time is up! Auto-submitting your test.");
                    submitTest(true); // true means auto-submitted
                }
            }, 1000);
        }

        function startTest() {
            const examName = document.getElementById('exam-select').value;
            const testName = document.getElementById('test-select').value;
            
            if(!examName || !testName) {
                alert("Please select both Exam and Test!");
                return;
            }

            document.getElementById('selection-area').style.display = 'none';
            document.getElementById('test-area').style.display = 'block';
            document.getElementById('test-title').innerText = `${examName} - ${testName}`;
            document.getElementById('test-container').innerHTML = '<p style="text-align:center; color:#718096; font-weight:500;">Loading Questions...</p>';

            fetch('/get-test-questions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ examName, testName })
            })
            .then(res => res.json())
            .then(data => {
                questionsData = data;
                renderTest();
                
                if(questionsData.length > 0) {
                    // 2 minutes (120 seconds) per question
                    const totalSeconds = questionsData.length * 120;
                    startTimer(totalSeconds);
                }
            });
        }

        function renderTest() {
            const container = document.getElementById('test-container');
            container.innerHTML = '';
            if(questionsData.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#e53e3e; font-weight:600;">No questions available for this test.</p>';
                document.getElementById('submit-btn').style.display = 'none';
                return;
            }

            questionsData.forEach((q, index) => {
                let html = `<div class="question">
                    <p style="font-size: 16px; margin-top:0;"><strong>Q${index + 1}: ${q.text}</strong> <span class="marks">+${q.positiveMarks} / -${q.negativeMarks}</span></p>
                    <ul class="options">`;
                
                q.options.forEach((opt, optIndex) => {
                    html += `<li><label><input type="radio" name="q${index}" value="${optIndex}"> ${opt}</label></li>`;
                });

                html += `</ul></div>`;
                container.innerHTML += html;
            });
            document.getElementById('submit-btn').style.display = 'block';
        }

        async function submitTest(isAutoSubmit = false) {
            if(!isAutoSubmit) {
                if(!confirm("Are you sure you want to submit the test?")) return;
            }

            // Stop the timer
            clearInterval(timerInterval);
            document.getElementById('timer-badge').style.display = 'none';

            let score = 0, correct = 0, wrong = 0, skipped = 0;
            questionsData.forEach((q, index) => {
                const selected = document.querySelector(`input[name="q${index}"]:checked`);
                if (selected) {
                    if (parseInt(selected.value) === q.correctOptionIndex) {
                        score += q.positiveMarks;
                        correct++;
                    } else {
                        score -= q.negativeMarks;
                        wrong++;
                    }
                } else {
                    skipped++;
                }
            });

            const examName = document.getElementById('exam-select').value;
            const testName = document.getElementById('test-select').value;
            const userEmail = localStorage.getItem('userEmail');

            const payload = {
                userName: localStorage.getItem('userName'),
                userEmail: userEmail,
                examName: examName,
                testName: testName,
                score: score, correct: correct, wrong: wrong, skipped: skipped
            };

            const container = document.getElementById('test-container');
            container.innerHTML = '<h3 style="text-align:center; color:#4299e1;">Submitting Test & Generating Leaderboard...</h3>';
            document.getElementById('submit-btn').style.display = 'none';

            try {
                await fetch('/save-result', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                const lbRes = await fetch('/leaderboard', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ examName, testName }) });
                const leaderboard = await lbRes.json();

                let userRank = leaderboard.findIndex(r => r.userEmail === userEmail && r.score === score) + 1;
                
                let resultHtml = `
                    <div class="result-box">
                        <h2 style="color:#2f855a; margin-top:0;">Test Submitted Successfully!</h2>
                        <h3 style="color:#2d3748; font-size: 24px;">📊 Your Score: ${score}</h3>
                        <p style="color:#4a5568; font-weight:500;">✅ Correct: ${correct} &nbsp;|&nbsp; ❌ Incorrect: ${wrong} &nbsp;|&nbsp; ⚠️ Skipped: ${skipped}</p>
                        <h2 style="color:#2b6cb0; border:2px dashed #3182ce; display:inline-block; padding:12px 25px; border-radius:12px; background:#ebf8ff;">🏆 Your Rank: #${userRank} <span style="font-size:16px; font-weight:500; color:#4a5568;">out of ${leaderboard.length}</span></h2>
                    </div>
                    
                    <h3 style="margin-top: 40px; color: #2d3748; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; text-align:left;">🏅 Live Leaderboard</h3>
                    <div style="overflow-x: auto;">
                    <table>
                        <thead><tr><th>Rank</th><th>Student Name</th><th>Score</th></tr></thead>
                        <tbody>
                `;

                leaderboard.forEach((entry, idx) => {
                    const isCurrentUser = (entry.userEmail === userEmail && entry.score === score);
                    const rowStyle = isCurrentUser ? 'background-color: #f0fff4; font-weight: 600; color: #2f855a;' : '';
                    const medal = idx === 0 ? '🥇 ' : (idx === 1 ? '🥈 ' : (idx === 2 ? '🥉 ' : ''));
                    resultHtml += `<tr style="${rowStyle}">
                        <td><strong style="font-size:16px;">${medal}#${idx + 1}</strong></td>
                        <td>${entry.userName} ${isCurrentUser ? '<span style="font-size:12px; background:#48bb78; color:white; padding:2px 6px; border-radius:10px; margin-left:5px;">You</span>' : ''}</td>
                        <td><strong style="font-size:16px;">${entry.score}</strong></td>
                    </tr>`;
                });

                resultHtml += `</tbody></table></div>
                <button onclick="location.reload()" style="margin-top:25px; background: #718096;">Return to Dashboard</button>`;

                container.innerHTML = resultHtml;

            } catch (error) {
                container.innerHTML = '<p style="color:#e53e3e; text-align:center; font-weight:bold;">Error processing result. Please refresh.</p>';
            }
        }
    </script>
</body>
</html>
